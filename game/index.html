<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
        }

        h1 {
            margin-bottom: 10px;
        }

        #game-board {
            background-color: #34495e;
            border: 4px solid #bdc3c7;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: block;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        p {
            color: #95a5a6;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>Classic Snake</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="game-board" width="400" height="400"></canvas>
    <p>Use Arrow Keys to move • Press Space to restart after Game Over</p>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        let snake = [{ x: 200, y: 200 }];
        let food = { x: 100, y: 100 };
        let dx = 0;
        let dy = -gridSize;
        let score = 0;
        let gameLoop;
        let gameSpeed = 100;

        function drawRect(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, gridSize, gridSize);
            ctx.strokeStyle = "#2c3e50";
            ctx.strokeRect(x, y, gridSize, gridSize);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const color = index === 0 ? "#2ecc71" : "#27ae60";
                drawRect(part.x, part.y, color);
            });
        }

        function drawFood() {
            drawRect(food.x, food.y, "#e74c3c");
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                generateFood();
                // Increase speed slightly
                if (gameSpeed > 50) gameSpeed -= 2;
                clearInterval(gameLoop);
                gameLoop = setInterval(main, gameSpeed);
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;

            // Check if food spawns on snake
            let onSnake = false;
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    onSnake = true;
                }
            });
            if (onSnake) generateFood();
        }

        function checkGameOver() {
            const head = snake[0];

            // Wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }

            return false;
        }

        function clearBoard() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function main() {
            if (checkGameOver()) {
                clearInterval(gameLoop);
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 30px 'Segoe UI', Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "18px 'Segoe UI', Arial, sans-serif";
                ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 25);
                return;
            }

            clearBoard();
            drawFood();
            moveSnake();
            drawSnake();
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            const SPACE_KEY = 32;

            const keyPressed = event.keyCode;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            // Prevent default scrolling for arrow keys and space
            if ([37, 38, 39, 40, 32].includes(keyPressed)) {
                event.preventDefault();
            }

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -gridSize;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -gridSize;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = gridSize;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = gridSize;
            }
            if (keyPressed === SPACE_KEY && checkGameOver()) {
                // Restart game
                snake = [{ x: 200, y: 200 }];
                dx = 0;
                dy = -gridSize;
                score = 0;
                gameSpeed = 100;
                document.getElementById('score').innerText = score;
                generateFood();
                gameLoop = setInterval(main, gameSpeed);
            }
        }

        // Initialize game
        generateFood();
        gameLoop = setInterval(main, gameSpeed);

    </script>
</body>

</html>
